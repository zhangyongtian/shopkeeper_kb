[project]
name = "shopkeeper-kb"
version = "0.1.0"
description = "智能知识库系统骨架工程"
readme = "README.md"
authors = [
    { name = "zyt", email = "zhangyongtianaa@sina.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "colorlog>=6.9.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.30.0",
    "langgraph>=1.2.10",
    "pypdf>=6.14.2",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "modelscope>=1.39.1",
    "pymilvus[milvus-lite]>=3.0.0",  # V1.1 梯队 0.4：Milvus 客户端，默认 Milvus Lite 本地模式（路线 E 零成本）
    "httpx>=0.28.0",    # E 路线：东财免费接口 HTTP 客户端（替代 requests）
    "beautifulsoup4>=4.12.0",  # 东财 F10 免费 HTML 解析
    "lxml>=5.3.0",     # bs4 lxml 解析器（速度快）
]

[project.scripts]
shopkeeper-kb = "shopkeeper_kb:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.1",
    "pytest>=8.3.3",       # 梯队 0.7 单测框架
    "pytest-asyncio>=0.24.0",  # FastAPI TestClient 异步单测
    "httpx>=0.28.0",       # TestClient 依赖
]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[tool.ruff]
line-length = 120
target-version = "py314"
lint.select = ["E", "F", "W", "I", "UP"]
lint.ignore = [
    "E501",  # 行长度已放宽到 120；长 docstring / 中文注释无法强制 88，合理放宽
    "UP007",  # 允许用 list[dict] 而不是 List[Dict]（py3.10+ 原生支持），这里 UP007 是 3.14 原生写法，忽略即可
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
