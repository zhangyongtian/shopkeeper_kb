[project]
name = "shopkeeper-kb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zyt", email = "zhangyongtianaa@sina.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "colorlog>=6.9.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.30.0",
    "langgraph>=1.2.10",
]

[project.scripts]
shopkeeper-kb = "shopkeeper_kb:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.1",
]
