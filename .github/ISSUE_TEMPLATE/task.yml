name: Task
description: 项目任务清单项（用于多智能体协同与合并队列）
title: "[Task] "
labels:
  - task
body:
  - type: input
    id: order
    attributes:
      label: Order
      description: 合并顺序号（建议 3 位数字，如 001/010/120）。后续 PR 需打标签 queue/<order>
      placeholder: "001"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: 主要影响范围（用于分配智能体与降低冲突）
      options:
        - api
        - db
        - workflow
        - agent
        - tools
        - infra
        - docs
        - config
        - other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 一句话描述要解决的问题与目标
      placeholder: 描述清楚“为什么要做”和“做完是什么状态”
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Definition of Done
      description: 验收标准（必须可检查）
      value: |-
        - [ ] 功能/修复按预期生效
        - [ ] 变更已按 atomic commits 拆分并符合提交规范
        - [ ] CI/检查通过（如启用）
        - [ ] 无敏感信息进入仓库
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: 约束、风险点、迁移说明、参考链接等（可选）
    validations:
      required: false

